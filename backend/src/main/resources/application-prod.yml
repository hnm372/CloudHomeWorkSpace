# prod profile. Set environment variables before running the backend.
server:
  port: ${SERVER_PORT:8088}
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  freemarker:
    request-context-attribute: request
    charset: UTF-8
    template-loader-path: classpath:/
    suffix: .ftl
    prefix: /view
mybatis-plus:
  mapper-locations: classpath*:/mapper/**Mapper.xml
  configuration:
    map-underscore-to-camel-case: false
app:
  jwt-secret: ${APP_JWT_SECRET}
  baidu-ocr-app-id: ${BAIDU_OCR_APP_ID:}
  baidu-ocr-api-key: ${BAIDU_OCR_API_KEY:}
  baidu-ocr-secret-key: ${BAIDU_OCR_SECRET_KEY:}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
  download-path: ${APP_DOWNLOAD_PATH:./var/uploads}
  upload-path: ${APP_UPLOAD_PATH:./var/uploads}
  file-type-array: .png,.jpg,.jpeg,.txt,.zip,.rar,.pdf,.xml,.xls,.doc,.docx
  max-file-size: 8192
logging:
  config: classpath:log4j2.yml
knife4j:
  basic:
    enable: false
